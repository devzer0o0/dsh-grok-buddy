<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><style>
 body{margin:0;padding:24px 26px 32px;background:#15171c;color:#e8e8ea;font:13px/1.55 -apple-system,"PingFang SC",sans-serif}
 h1{font-size:15px;font-weight:600;margin:0 0 4px;color:#f0f1f3}
 .sub{font-size:12px;color:#6b7280;margin:0 0 4px;max-width:780px}
 h2{font-size:12px;font-weight:600;color:#9aa3b2;margin:26px 0 14px;letter-spacing:.04em}
 .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:24px 12px}
 .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
 .box{width:64px;height:64px;display:flex;align-items:center;justify-content:center}
 .box.small{width:16px;height:16px}
 .n{font-size:12px;color:#dfe2e8;font-weight:500}
 .k{font-size:9.5px;color:#7b8494;font-family:ui-monospace,Menlo,monospace}
 .c{font-size:8.5px;color:#4b5563;font-family:ui-monospace,Menlo,monospace;text-align:center;line-height:1.35}
 .note{font-size:11px;color:#6b7280;margin:14px 0 0;max-width:780px;line-height:1.6}
 .ink{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;margin:0 3px}
 .row{display:flex;gap:0;align-items:flex-start}
</style></head><body>
<h1>运行状态：六个，一个不多一个不少</h1>
<p class="sub">六态全部使用<strong>同一个项目身份色</strong><span class="ink" style="background:#1084fe"></span>——颜色表示「这是哪个项目」，不表示状态。状态完全由动作表达，和官网 lifecycle 演示一致。</p>
<div id="root"></div>
<p class="note">动作预设名（motion preset）是内部动画资源标识，不是对外状态。素材库里还有 proud / excited / curious / sleeping 等二十多个预设，它们只作为表情素材参考（见 docs/faces.html），不参与会话状态判定。</p>
<script type="module">
import { TB_EXPRESSIONS, TB_SHAPES, TB_STATES } from '../src/grokbot/data.js'
import { createBot, runBot } from '../src/grokbot/engine.js'

// 六态 → 动作预设（与 src/mapping.js 的 PHASE_TO_MOTION 一致）
const PHASES = [
  ['idle', 'idle', '空闲'],
  ['working', 'working', '正在处理'],
  ['waiting', 'bored', '正在等待'],
  ['blocked', 'alerting', '已阻止'],
  ['thinking', 'thinking', '思考'],
  ['done', 'celebrate', '完成'],
]

// 同一个项目身份色：六态共用，证明颜色不承担状态
const PROJECT_INK = '#1084fe'
const SURFACE = '#15171c'

const root = document.getElementById('root')

function grid(title) {
  const h = document.createElement('h2')
  h.textContent = title
  root.appendChild(h)
  const g = document.createElement('div')
  g.className = 'grid'
  root.appendChild(g)
  return g
}

function render(target, phase, motion, label, size) {
  const cell = document.createElement('div')
  cell.className = 'cell'
  const box = document.createElement('div')
  box.className = size === 16 ? 'box small' : 'box'
  const inst = createBot({ shape: TB_SHAPES.blob, bodyFill: PROJECT_INK, eyeFill: SURFACE, size: size })
  inst.state = motion
  box.appendChild(inst.svg)
  runBot(inst, { expressions: TB_EXPRESSIONS, states: TB_STATES, reduced: false })
  cell.appendChild(box)
  if (size !== 16) {
    const n = document.createElement('div')
    n.className = 'n'
    n.textContent = label
    const k = document.createElement('div')
    k.className = 'k'
    k.textContent = phase
    const c = document.createElement('div')
    c.className = 'c'
    c.textContent = 'motion: ' + motion
    cell.append(n, k, c)
  }
  target.appendChild(cell)
}

const big = grid('六态的实际动作（放大到 64px 便于观察；同一身份色）')
for (const [phase, motion, label] of PHASES) render(big, phase, motion, label, 64)

const small = grid('同一只头像在侧栏里的真实尺寸（16px）')
for (const [phase, motion, label] of PHASES) render(small, phase, motion, label, 16)
</script>
</body></html>
