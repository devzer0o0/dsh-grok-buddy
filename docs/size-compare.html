<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>侧栏真实尺寸：20px vs 24px</title><style>
 body{margin:0;padding:22px 24px 26px;background:#15171c;color:#e8e8ea;font:13px/1.55 -apple-system,"PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
 h1{font-size:15px;font-weight:600;margin:0 0 5px;color:#f0f1f3}
 .sub{font-size:12px;color:#8b93a1;margin:0 0 16px;max-width:820px}
 .side{background:#1b1d22;border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:8px 0;width:420px}
 .head{font-size:11px;letter-spacing:.06em;color:#7b8494;font-weight:600;padding:2px 10px 8px}
 .row{display:flex;align-items:center;height:32px;padding:0 8px;gap:6px}
 .row.on{background:rgba(127,127,127,.13);border-radius:8px}
 .slot{height:20px;display:inline-flex;align-items:center;justify-content:center;flex:none}
 .name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:#dfe3ea}
 .tag{font-size:10px;color:#6b7280;font-family:ui-monospace,Menlo,monospace}
 .panes{display:flex;gap:22px;align-items:flex-start}
 .note{font-size:11px;color:#7b8494;margin:12px 0 0;max-width:880px;line-height:1.65}
 code{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;background:rgba(255,255,255,.06);padding:1px 5px;border-radius:4px;color:#c9cdd6}
</style></head><body>
<h1>同一套渲染器，只改尺寸：20px（此前画布）对比 24px（现在）</h1>
<p class="sub">按真实 CSS 尺寸在浏览器中渲染；文档截图为阅读方便放大，不是 DSH 实机截图。24px 画布中的本体是 16px；前导位同步扩展，32px 行高不变。</p>
<div class="panes">
  <div class="side" id="p20"><div class="head">20px · 此前尺寸</div></div>
  <div class="side" id="p24"><div class="head">24px · 现在（BOT_SIZE）</div></div>
</div>
<p class="note">
  画布边长放大 <strong>20%</strong>，本体从约 13.3px 增至 16px；彩带与眼睛同步等比放大。
  24px 下思考单点约 4.5–5.4 CSS px，仍不溢出画布。这里只展示静态代表帧；动态循环另见预览页。
</p>
<script type="module">
import { TB_EXPRESSIONS, TB_SHAPES } from '../src/grokbot/data.js'
import { createBot, runBot } from '../src/grokbot/engine.js'
import { PHASE_TO_MOTION } from '../src/mapping.js'
import { BOT_SIZE } from '../src/widget/styles.js'

const INK = '#1084fe'
const SURFACE = '#1b1d22'
const ITEMS = [
  ['idle', '空闲 · 等你回来'],
  ['working', '正在处理 · 跑工具'],
  ['waiting', '正在等待 · 要你确认'],
  ['blocked', '已阻止 · 任务级错误停止'],
  ['thinking', '思考 · 模型在跑'],
  ['done', '完成 · 刚干完'],
]

for (const [pane, size] of [[document.getElementById('p20'), 20], [document.getElementById('p24'), BOT_SIZE]]) {
  for (const [phase, text] of ITEMS) {
    const row = document.createElement('div')
    row.className = 'row'
    const slot = document.createElement('span')
    slot.className = 'slot'
    slot.style.width = slot.style.height = size + 'px'
    const inst = createBot({ shape: TB_SHAPES.blob, expressions: TB_EXPRESSIONS, bodyFill: INK, eyeFill: SURFACE, size })
    inst.state = PHASE_TO_MOTION[phase]
    slot.appendChild(inst.svg)
    runBot(inst, { reduced: true })
    const name = document.createElement('span')
    name.className = 'name'
    name.textContent = text
    const tag = document.createElement('span')
    tag.className = 'tag'
    tag.textContent = size + 'px'
    row.append(slot, name, tag)
    pane.appendChild(row)
  }
}
document.querySelector('#p24 .row').classList.add('on')
</script>
</body></html>
