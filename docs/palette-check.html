<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<title>dsh-grok-buddy · 墨色核对</title>
<style>
 *{box-sizing:border-box}
 body{margin:0;font:13px/1.5 -apple-system,"PingFang SC","Helvetica Neue",sans-serif;background:#0d0e11}
 .wrap{display:flex;gap:16px;padding:16px}
 .panel{flex:1;padding:16px 18px;border-radius:14px}
 .panel.dark{background:#121317;color:#e8e8ea}
 .panel.light{background:#f7f7f8;color:#1b1d22}
 .panel h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 14px;opacity:.55;font-weight:600}
 .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
 .cell{display:flex;flex-direction:column;align-items:center;gap:5px}
 .box{width:38px;height:38px;display:flex;align-items:center;justify-content:center}
 .n{font-size:11.5px}
 .k{font-size:9px;font-family:ui-monospace,Menlo,monospace;opacity:.5}
 footer{padding:2px 18px 18px;font-size:11px;color:#7b8290;line-height:1.8}
 code{background:rgba(127,127,127,.16);padding:1px 5px;border-radius:4px;font-size:10.5px}
</style></head><body>
<div class="wrap">
  <div class="panel dark"><h2>暗色侧栏 · #121317</h2><div class="grid" id="g-dark"></div></div>
  <div class="panel light"><h2>亮色侧栏 · #f7f7f8</h2><div class="grid" id="g-light"></div></div>
</div>
<footer>
  眼睛填的是<strong>背景色</strong>（官方 <code>.head{fill:var(--fg)}</code> / <code>.eye{fill:var(--bg)}</code>）：
  插件从状态位背后量出实际底色再填，所以两侧的眼睛各自和各自的底色对得上。
  墨色只跟相位走，不跟主题走 —— 只有 idle 的灰按官方 <code>--fig-gray</code> 取亮/暗两值。
  细分相位同色不同脸：<code>tool</code> 与 <code>streaming</code> 都是 Working，<code>retry</code> 与 <code>waiting</code> 都是 Waiting。
</footer>
<script>
(function () {
  const MAP = [['空闲', 'idle'], ['思考', 'thinking'], ['正在处理', 'working'],
               ['正在等待', 'waiting'], ['已阻止', 'blocked'], ['完成', 'done']];
  // 先建 DOM，再给 widget 喂数据 —— 两个面板各一套会话 id
  const sessions = [];
  function mount(pane, label, phase) {
    const id = pane + '-' + phase;
    sessions.push({ id: id, phase: phase, detail: '' });
    const cell = document.createElement('div'); cell.className = 'cell';
    const box = document.createElement('div'); box.className = 'box';
    const row = document.createElement('div');
    row.setAttribute('data-row-key', 'session:' + id);
    row.style.cssText = 'display:flex;align-items:center;justify-content:center';
    const slot = document.createElement('span');
    slot.style.cssText = 'width:16px;height:20px;display:inline-flex;align-items:center;justify-content:center';
    row.appendChild(slot); box.appendChild(row); cell.appendChild(box);
    const n = document.createElement('div'); n.className = 'n'; n.textContent = label;
    const k = document.createElement('div'); k.className = 'k'; k.textContent = phase;
    cell.appendChild(n); cell.appendChild(k);
    return cell;
  }
  const dark = document.getElementById('g-dark');
  const light = document.getElementById('g-light');
  for (const [label, phase] of MAP) { dark.appendChild(mount('d', label, phase)); light.appendChild(mount('l', label, phase)); }

  window.__GROK_BUDDY_DEMO__ = { now: Date.now(), sessions: sessions };
  const realFetch = window.fetch;
  window.fetch = (u, o) => String(u).includes('/dsh-grok-buddy/state.json')
    ? Promise.resolve(new Response(JSON.stringify(Object.assign({ ok: true }, window.__GROK_BUDDY_DEMO__)), { status: 200 }))
    : realFetch.call(window, u, o);
  const s = document.createElement('script');
  s.src = '../lib/widget.js';
  document.head.appendChild(s);
  setInterval(function () {
    document.querySelectorAll('svg.dsgb-bot').forEach((svg) => { svg.setAttribute('width', '38'); svg.setAttribute('height', '38'); });
  }, 60);
})();
</script></body></html>
