name: CI and npm Publish

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  NPM_REGISTRY: 'https://registry.npmjs.org'

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # 这个包没有运行时依赖，也没有 lockfile —— 构建就是 scripts/build.mjs，
      # 所以不需要安装任何东西。
      - name: Build widget bundle
        run: npm run build
      - name: Committed bundle is up to date
        shell: bash
        run: |
          set -euo pipefail
          # lib/widget.js 是入库的构建产物；src/ 改了却没重新构建，这里就红。
          if ! git diff --exit-code -- lib/widget.js; then
            echo "::error::lib/widget.js 与 src/ 不同步，请在本地跑 npm run build 后一起提交。"
            exit 1
          fi
      - name: Run tests
        run: npm test
      - name: Declares a dsh.bundle manifest
        shell: bash
        run: |
          set -euo pipefail
          # dsh plugin add 靠这个清单识别插件；缺了就不是可安装的插件。
          node -e "const p=require('./package.json'); if(!p.dsh||!p.dsh.bundle||!p.dsh.bundle.patch){console.error('package.json 缺少 dsh.bundle.patch'); process.exit(1)}"
          test -f ./cordis.patch.yml
      - name: Inspect npm package contents
        run: npm pack --dry-run

  publish:
    name: Publish to npm
    needs: quality
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NPM_REGISTRY }}
      - name: Resolve publish version
        id: release
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          BASE_VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$BASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::package.json version must be a stable X.Y.Z value; got $BASE_VERSION"
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # 手动触发：发 package.json 里的版本号，用于补发历史版本。
            PUBLISH_VERSION="$BASE_VERSION"
            DIST_TAG="latest"
          elif [[ "$REF_TYPE" == "branch" ]]; then
            PUBLISH_VERSION="${BASE_VERSION}-dev.${GITHUB_RUN_ID}"
            DIST_TAG="next"
            node - "$PUBLISH_VERSION" <<'NODE'
          const fs = require('node:fs');
          const version = process.argv[2];
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.version = version;
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
          elif [[ "$REF_TYPE" == "tag" ]]; then
            if [[ "$REF_NAME" != "v$BASE_VERSION" ]]; then
              echo "::error::tag $REF_NAME must exactly match v$BASE_VERSION"
              exit 1
            fi
            PUBLISH_VERSION="$BASE_VERSION"
            DIST_TAG="latest"
          else
            echo "::error::unsupported ref type: $REF_TYPE"
            exit 1
          fi

          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PUBLISH_VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
      - name: Build package
        run: npm run build
      - name: Check whether the version already exists
        id: published
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          if QUERY_OUTPUT="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry="$NPM_REGISTRY" 2>&1)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published."
          elif grep -q 'E404' <<< "$QUERY_OUTPUT"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$QUERY_OUTPUT" >&2
            exit 1
          fi
      - name: Publish package
        if: steps.published.outputs.exists != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: npm publish --tag "$DIST_TAG" --access public
